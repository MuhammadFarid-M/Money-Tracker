<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1115">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Budgetly Money Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#F2F3EE; --surface:#FCFCFA; --surface-2:#E9EBE4; --ink:#171A21; --ink-2:#474D5B; --muted:#6E7482;
  --line:#DADDD4; --accent:#3531A8; --accent-ink:#3CFF6E; --head:#171A21; --accent-soft:#E3E2F6; --accent-2:#C9C7F0;
  --crit-ink:#FFFFFF; --good:#1D6B1D; --good-bg:#E1F0DE; --warn:#8A5A00; --warn-bg:#F8EDD3; --crit:#B42828; --crit-bg:#F8E1DF;
  --grid:#E1E0D9; --axis:#B9B8AE;
  --c-food:#2a78d6; --c-groceries:#eb6834; --c-travel:#1baf7a; --c-shopping:#eda100;
  --c-bills:#e87ba4; --c-fun:#008300; --c-health:#4a3aa7; --c-other:#9a9890;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --shadow:0 1px 2px rgba(23,26,33,.06), 0 8px 24px rgba(23,26,33,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0F1115; --surface:#181B21; --surface-2:#232730; --ink:#EEF0F4; --ink-2:#C3C8D2; --muted:#8F96A3;
    --line:#2C3139; --accent:#9591F2; --accent-ink:#14142B; --head:#3CFF6E; --accent-soft:#25254A; --accent-2:#3A3A70;
    --crit-ink:#2A0D0D; --good:#4CC44C; --good-bg:#16301A; --warn:#F2B53A; --warn-bg:#35290F; --crit:#F27B7B; --crit-bg:#3A1A1A;
    --grid:#2A2D33; --axis:#454A52;
    --c-food:#3987e5; --c-groceries:#d95926; --c-travel:#199e70; --c-shopping:#c98500;
    --c-bills:#d55181; --c-fun:#1f9a1f; --c-health:#9085e9; --c-other:#8a8984;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F1115; --surface:#181B21; --surface-2:#232730; --ink:#EEF0F4; --ink-2:#C3C8D2; --muted:#8F96A3;
  --line:#2C3139; --accent:#9591F2; --accent-ink:#14142B; --head:#3CFF6E; --accent-soft:#25254A; --accent-2:#3A3A70;
  --crit-ink:#2A0D0D; --good:#4CC44C; --good-bg:#16301A; --warn:#F2B53A; --warn-bg:#35290F; --crit:#F27B7B; --crit-bg:#3A1A1A;
  --grid:#2A2D33; --axis:#454A52;
  --c-food:#3987e5; --c-groceries:#d95926; --c-travel:#199e70; --c-shopping:#c98500;
  --c-bills:#d55181; --c-fun:#1f9a1f; --c-health:#9085e9; --c-other:#8a8984;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
/* always dark: same look on every device */
:root,:root[data-theme="light"],:root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0F1115; --surface:#181B21; --surface-2:#232730; --ink:#EEF0F4; --ink-2:#C3C8D2; --muted:#8F96A3;
    --line:#2C3139; --accent:#9591F2; --accent-ink:#14142B; --head:#3CFF6E; --accent-soft:#25254A; --accent-2:#3A3A70;
    --crit-ink:#2A0D0D; --good:#4CC44C; --good-bg:#16301A; --warn:#F2B53A; --warn-bg:#35290F; --crit:#F27B7B; --crit-bg:#3A1A1A;
    --grid:#2A2D33; --axis:#454A52;
    --c-food:#3987e5; --c-groceries:#d95926; --c-travel:#199e70; --c-shopping:#c98500;
    --c-bills:#d55181; --c-fun:#1f9a1f; --c-health:#9085e9; --c-other:#8a8984;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em;color:var(--head)}
.safe h1,.safe h2,.safe h3{color:inherit}
.tile .v,.env .bal:not(.neg),.brand,.mcard h3,.card h3,.alert .h,.eamt,.cbar .amt,.hero-num,.verdict .vh + p b{color:var(--head)}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.shell{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 150px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 18px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--accent-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.block{width:100%}
.btn.small{min-height:34px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--crit);border-color:var(--crit-bg)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{font-size:17px;font-weight:700}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}

/* home */
.home{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:18px 64px}
.home-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:36px}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,5.2vw,58px);line-height:1.02;font-weight:800;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--accent)}
.lede{font-size:18px;color:var(--ink-2);max-width:34em;margin-top:18px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.fine{font-size:13px;color:var(--muted);margin-top:12px}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;max-width:380px;justify-self:center;width:100%}
.preview .tagline{font-size:12px;color:var(--muted)}
.home-sec{margin-top:72px}
.home-sec h2{font-size:clamp(26px,3.4vw,36px);font-weight:800;letter-spacing:-.02em;max-width:22em}
.home-sec .intro{color:var(--ink-2);font-size:17px;max-width:40em;margin-top:10px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.pitem{border-top:2px solid var(--ink);padding-top:14px}
.pitem h3{font-size:19px;font-weight:700;margin-bottom:6px}
.pitem p{color:var(--ink-2)}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}
.fitem{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.fitem .k{font-family:var(--display);font-weight:700;font-size:13px;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.fitem h3{font-size:20px;margin:6px 0 6px;font-weight:700}
.fitem p{color:var(--ink-2)}
.fitem .ex{margin-top:12px;font-size:14px;background:var(--surface-2);border-radius:10px;padding:10px 12px;color:var(--ink-2)}
.cmp{width:100%;border-collapse:collapse;margin-top:20px;font-size:15px;min-width:560px}
.cmp th,.cmp td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp th{font-size:13px;color:var(--muted);font-weight:600}
.cmp td.us{font-weight:600;color:var(--ink)}
.cmp td:first-child{color:var(--ink-2)}
.scrollx{overflow-x:auto}
.home-foot{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;gap:28px}
  .pgrid{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .home-sec{margin-top:52px}
}

/* app header */
.apphead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.apphead h1{font-size:22px;font-weight:800}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.iconbtn svg{width:20px;height:20px}

/* safe card */
.safe{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.safe .lbl{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.safe .big{font-family:var(--display);font-size:48px;font-weight:800;line-height:1;letter-spacing:-.03em}
.safe .sub{font-size:14px;opacity:.9}
.safe.over{background:var(--crit);color:var(--crit-ink)}
.safe .ticks{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.safe .tick{font-size:12px;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px}

/* progress */
.bar{height:12px;border-radius:999px;background:var(--surface-2);position:relative;overflow:visible}
.bar .fill{height:100%;border-radius:999px;background:var(--accent)}
.bar .fill.over{background:var(--crit)}
.bar .mark{position:absolute;top:-5px;width:2px;height:22px;background:var(--ink);border-radius:2px}
.barlegend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px;gap:8px}

/* pills & alerts */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.alert .ic{flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;margin-top:1px}
.alert.good .ic{background:var(--good-bg);color:var(--good)}
.alert.warn .ic{background:var(--warn-bg);color:var(--warn)}
.alert.crit .ic{background:var(--crit-bg);color:var(--crit)}
.alert.info .ic{background:var(--accent-soft);color:var(--accent)}
.alert b{font-weight:700}
.alert .t{font-size:14px;color:var(--ink-2)}
.alert .h{font-weight:700;color:var(--ink);font-size:15px}

/* category bars */
.cbars{display:flex;flex-direction:column;gap:12px}
.cbar{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:none;border:0;padding:0;text-align:left;width:100%}
.cbar .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.cbar .amt{font-size:14px;font-weight:600;text-align:right}
.cbar .amt small{color:var(--muted);font-weight:500;margin-left:4px}
.cbar .trk{grid-column:1 / -1;height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.cbar .trk i{display:block;height:100%;border-radius:999px}
button.cbar:hover .nm{color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

/* expense list */
.elist{display:flex;flex-direction:column}
.erow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.erow:last-child{border-bottom:0}
.erow:hover .enote{color:var(--accent)}
.eicon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:13px;color:#fff}
.enote{font-weight:600;font-size:15px;line-height:1.25}
.emeta{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.eamt{font-weight:700;font-size:15px}
.src{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:0 5px;color:var(--muted)}

/* nav */
.navwrap{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.fabwrap{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:21;pointer-events:none}
.fabin{max-width:560px;margin:0 auto;padding-inline:16px;display:flex;justify-content:flex-end}
.fab{pointer-events:auto;background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:14px 20px;font-weight:700;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow);font-size:15px}

/* charts */
.chart{position:relative;width:100%;min-height:120px}
.chart svg{display:block;max-width:100%;touch-action:pan-y}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:3px;border-radius:2px;display:inline-block}
.sw.dash{background:repeating-linear-gradient(90deg,var(--accent) 0 4px,transparent 4px 7px)!important}
.tip{position:fixed;z-index:60;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.35;pointer-events:none;max-width:220px;box-shadow:var(--shadow)}
.tip b{font-weight:700}
.donutwrap{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.dleg{display:flex;flex-direction:column;gap:6px;font-size:14px}
.dleg div{display:flex;align-items:center;gap:8px;justify-content:space-between}
.dleg div span:first-child{display:flex;align-items:center;gap:8px;min-width:0}
@media (max-width:380px){.donutwrap{grid-template-columns:1fr;justify-items:center}.dleg{width:100%}}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tile .v{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
.tile .s{font-size:13px;color:var(--ink-2)}

/* month cards */
.mcard{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.mcard:hover{border-color:var(--accent-2)}
.mcard h3{font-size:18px;font-weight:700}
.stackbar{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;background:var(--surface-2)}
.stackbar i{display:block;height:100%}

/* sheets */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheethead{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.sheethead .in{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;display:flex;align-items:center;gap:10px}
.sheethead h2{font-size:19px;font-weight:700;flex:1;min-width:0}
.sheet .shell{padding-block:16px 60px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:44px}
textarea.input{min-height:96px;resize:vertical}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.amtbox{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 16px}
.amtbox span{font-family:var(--display);font-size:34px;font-weight:700;color:var(--muted)}
.amtbox input{border:0;background:none;font-family:var(--display);font-size:40px;font-weight:800;width:100%;outline:none;min-width:0}
.amtbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.err{color:var(--crit);font-size:14px;font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:1.5px dashed var(--accent-2);border-radius:16px;padding:28px 16px;background:var(--surface)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop .big{font-family:var(--display);font-weight:700;font-size:18px}
.itemrow{display:grid;grid-template-columns:1fr 92px;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.itemrow .nm{font-weight:600;font-size:14px}
.itemrow select{grid-column:1 / -1}
.fxrow{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center}
.fxrow select{grid-column:1 / 3}
.receipt{display:flex;gap:12px;align-items:center}
.receipt img{width:64px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.msg{max-width:88%;border-radius:16px;padding:10px 14px;font-size:15px}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg p+p,.msg p+ul,.msg ul+p{margin-top:6px}
.msg ul{margin:4px 0 0;padding-left:18px}
.msg .note{font-size:12px;color:var(--muted);margin-top:6px}
.typing{color:var(--muted);font-style:italic}
.chatdock{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:21;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.chatdock .in{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:10px 10px;display:flex;flex-direction:column;gap:8px}
.qchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.qchips::-webkit-scrollbar{display:none}
.qchip{flex:none;border:1px solid var(--accent-2);background:var(--surface);color:var(--accent);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.prompt{display:flex;gap:8px}
.prompt input{flex:1;min-width:0}
.aibadge{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.aibadge i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.aibadge.on i{background:var(--good)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:70;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:19px;margin-bottom:6px}
.divider{height:1px;background:var(--line)}
.aitext{font-size:15px;color:var(--ink-2)}
.aitext p+p{margin-top:8px}
.aitext ul{margin:6px 0 0;padding-left:18px}
.delta{font-size:13px;font-weight:700;white-space:nowrap}
.delta.up{color:var(--crit)}
.delta.down{color:var(--good)}
.cmprow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.cmprow:last-child{border-bottom:0}
/* envelopes */
.envgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:360px){.envgrid{grid-template-columns:1fr}}
.env{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 14px 14px;overflow:hidden;display:flex;flex-direction:column;gap:4px;min-height:150px;width:100%}
.env:hover{border-color:var(--accent-2)}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:20px;background:var(--ec);opacity:.85;clip-path:polygon(0 0,100% 0,50% 100%)}
.env .nm{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.2}
.env .bal{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.env .bal.neg{color:var(--crit)}
.env .meta{font-size:13px;color:var(--muted);line-height:1.35}
.env .meta.bad{color:var(--crit);font-weight:700}
.env .meter{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:auto}
.env .meter i{display:block;height:100%;border-radius:999px;background:var(--ec)}
.env .tag{position:absolute;top:24px;right:12px;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;width:100%;color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt[disabled]{opacity:.55;cursor:not-allowed}
.opt .t{font-weight:700}
.opt .s{font-size:13px;color:var(--muted)}
.verdict{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:14px}
.verdict.ok{background:var(--good-bg)}
.verdict.no{background:var(--crit-bg)}
.verdict .vi{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.verdict.ok .vi,.verdict.ok .vh{color:var(--good)}
.verdict.no .vi,.verdict.no .vh{color:var(--crit)}
.verdict .vh{font-weight:800;font-size:17px;font-family:var(--display)}
.verdict p{color:var(--ink-2);font-size:15px;margin-top:2px}
.envrow{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center}
.envrow label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--ink)}
.goalrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.goalrow .full{grid-column:1 / -1}
.mvrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.mvrow:last-child{border-bottom:0}
.mvrow .s{font-size:13px;color:var(--muted)}
.plan{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14px;display:grid;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="root"></div>
<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';

/* ---------- constants & helpers ---------- */
const CATS=[
  {id:'food',name:'Food & dining',short:'Fd'},
  {id:'groceries',name:'Groceries',short:'Gr'},
  {id:'travel',name:'Travel',short:'Tr'},
  {id:'shopping',name:'Shopping',short:'Sh'},
  {id:'bills',name:'Bills & rent',short:'Bl'},
  {id:'fun',name:'Entertainment',short:'En'},
  {id:'health',name:'Health',short:'He'},
  {id:'other',name:'Other',short:'Ot'}
];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const cc=id=>`var(--c-${CAT[id]?id:'other'})`;
const KEY='budgetly.v1';const OLD_KEY='kharcha.v1';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const inr=n=>(n<0?'−':'')+'₹'+Math.round(Math.abs(n)).toLocaleString('en-IN');
const inrK=n=>{const a=Math.abs(n);if(a>=100000)return '₹'+(Math.round(a/10000)/10)+'L';if(a>=1000)return '₹'+(Math.round(a/100)/10)+'k';return '₹'+Math.round(a);};
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mkey=s=>s.slice(0,7);
const pmk=k=>({y:+k.slice(0,4),m:+k.slice(5,7)});
const dim=k=>{const {y,m}=pmk(k);return new Date(y,m,0).getDate();};
const addMonths=(k,n)=>{const {y,m}=pmk(k);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;};
const monthName=k=>MONTHS[pmk(k).m-1]+' '+pmk(k).y;
const mShort=k=>MONTHS[pmk(k).m-1].slice(0,3);
const mLong=k=>MONTHS[pmk(k).m-1];
const dayLabel=s=>{const d=new Date(s+'T00:00:00');return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3);};
const TODAY=new Date();
const todayStr=dstr(TODAY);
const CUR=mkey(todayStr);
const DAY=TODAY.getDate();
let uid=Date.now()%100000;
const newId=p=>(p||'e')+(uid++).toString(36);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- storage ---------- */
let S=null;
function load(){try{const raw=localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY);if(raw){const v=JSON.parse(raw);if(v&&v.profile&&Array.isArray(v.expenses))S=v;}}catch(e){S=null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){
  // quota: drop bill thumbnails and retry once
  try{if(S&&S.bills){Object.values(S.bills).forEach(b=>{b.thumb=null;});localStorage.setItem(KEY,JSON.stringify(S));}}catch(e2){}
}}

/* ---------- demo data ---------- */
const SAMPLE_BILL={merchant:'DMart, Powai',items:[
  {name:'Toor dal 1 kg',amount:168,cat:'groceries'},
  {name:'Amul Taaza milk 1 L × 2',amount:136,cat:'groceries'},
  {name:'India Gate basmati 5 kg',amount:645,cat:'groceries'},
  {name:'Onions 2 kg',amount:84,cat:'groceries'},
  {name:"Lay's chips × 3",amount:60,cat:'food'},
  {name:'Coca-Cola 2.25 L',amount:99,cat:'food'},
  {name:'Dairy Milk Silk',amount:95,cat:'food'},
  {name:'Surf Excel Matic 1 kg',amount:249,cat:'other'},
  {name:'Colgate toothpaste 200 g',amount:118,cat:'other'}
]};

function seedDemo(){
  const rnd=mulberry32(20260928);
  const r=(a,b)=>a+rnd()*(b-a);
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const profile={name:'Aarav',salary:75000,target:49997,saveTarget:22000,savingsMonthly:6000,
    env:{food:9000,groceries:6000,travel:5000,shopping:4000,bills:2200,fun:1600,health:2000,other:800},
    goals:[{id:'g-bike',name:'Bike',target:200000,monthly:12000},{id:'g-goa',name:'Goa trip',target:40000,monthly:4000}],
    rollover:{},
    fixed:[
    {name:'House rent',amount:18000,cat:'bills'},
    {name:'Wi-Fi broadband',amount:799,cat:'bills'},
    {name:'Mobile recharge',amount:399,cat:'bills'},
    {name:'Netflix',amount:199,cat:'fun'}]};
  const fixedTot=sum(profile.fixed.map(f=>f.amount));
  const varBudget=profile.target-fixedTot;
  const plan=[{k:addMonths(CUR,-3),v:26400},{k:addMonths(CUR,-2),v:34500,spike:true},{k:addMonths(CUR,-1),v:29700},{k:CUR,v:null}];
  const exps=[];const months={};const bills={};
  let id=1;
  for(const p of plan){
    const n=dim(p.k);const {y,m}=pmk(p.k);const last=p.k===CUR?DAY:n;
    months[p.k]={target:profile.target,salary:profile.salary};
    profile.fixed.forEach(f=>exps.push({id:'s'+(id++),date:p.k+'-01',amount:f.amount,cat:f.cat,note:f.name,source:'fixed'}));
    const raw=[];
    const add=(d,a,cat,note,fp)=>raw.push({date:`${p.k}-${pad(d)}`,amount:a,cat,note,fp:!!fp});
    for(let d=1;d<=last;d++){
      const wd=new Date(y,m-1,d).getDay();const we=wd===0||wd===6;const fri=wd===5;
      if(p.k===CUR&&d===DAY){add(d,30,'food','Chai at office',true);add(d,70,'travel','Auto to office',true);continue;}
      if(rnd()<0.85){const o=pick([['Chai & samosa',40,90],['Canteen lunch',110,180],['Chai Point',50,120],['Juice stall',50,90],['Office cafeteria',120,200]]);add(d,r(o[1],o[2]),'food',o[0]);}
      if(rnd()<(fri||we?0.6:0.3))add(d,r(260,680),'food',pick(['Swiggy','Zomato','Swiggy','Domino’s'])+' order');
      if(wd===0)add(d,r(900,2200),'groceries',pick(['DMart','BigBasket']));
      if(rnd()<0.18)add(d,r(150,520),'groceries',pick(['Blinkit','Zepto','Kirana store']));
      if(!we&&rnd()<0.75)add(d,r(40,160),'travel',pick(['Metro','Auto','Rapido bike']));
      if(rnd()<0.12)add(d,r(180,460),'travel',pick(['Uber','Ola']));
      if(d%10===4)add(d,r(1000,1500),'travel','Petrol');
      if(rnd()<(p.spike?0.15:0.06))add(d,r(450,2800),'shopping',pick(['Myntra','Amazon','Flipkart','Decathlon','Lifestyle']));
      if(d===9)add(d,r(1400,2100),'bills','Electricity bill');
      if(d===5)add(d,119,'fun','Spotify',true);
      if(we&&rnd()<0.3)add(d,r(350,900),'fun',pick(['PVR movie','BookMyShow','Bowling']));
      if(d===3)add(d,1499,'health','Cult.fit membership',true);
      if(rnd()<0.05)add(d,r(150,700),'health','Apollo Pharmacy');
      if(rnd()<0.03)add(d,r(300,1500),'other',pick(['Birthday gift','Haircut','Temple donation']));
    }
    let desired=p.v;
    if(desired==null)desired=varBudget*Math.max(0.5,DAY-0.5)/n*1.03;
    const sc=raw.filter(x=>!x.fp);const fixedPart=sum(raw.filter(x=>x.fp).map(x=>x.amount));
    const s=sum(sc.map(x=>x.amount));
    const f=s>0?Math.max(0.3,(desired-fixedPart)/s):1;
    raw.forEach(x=>{let a=x.fp?x.amount:x.amount*f;a=a>=100?Math.round(a/5)*5:Math.max(10,Math.round(a));exps.push({id:'s'+(id++),date:x.date,amount:a,cat:x.cat,note:x.note,source:'typed'});});
  }
  // a clothing purchase this month so the Shopping envelope has a story
  exps.push({id:'s'+(id++),date:`${CUR}-${pad(Math.max(1,DAY-6))}`,amount:1899,cat:'shopping',note:'Myntra',source:'typed'});
  // one AI-split bill in the current month, on the latest Sunday before today (or day 1)
  let bd=1;for(let d=DAY-1;d>=1;d--){if(new Date(pmk(CUR).y,pmk(CUR).m-1,d).getDay()===0){bd=d;break;}}
  const bdate=`${CUR}-${pad(bd)}`;
  // replace that day's plain grocery entry with the split bill
  for(let i=exps.length-1;i>=0;i--){if(exps[i].date===bdate&&exps[i].cat==='groceries'&&exps[i].source==='typed'){exps.splice(i,1);break;}}
  const billId='b1';bills[billId]={merchant:SAMPLE_BILL.merchant,date:bdate,items:SAMPLE_BILL.items.slice(),thumb:null};
  groupBill(SAMPLE_BILL.items).forEach(g=>exps.push({id:'s'+(id++),date:bdate,amount:g.amount,cat:g.cat,note:SAMPLE_BILL.merchant,source:'bill',billId}));
  // fit envelope budgets to the demo's own spending: past-month average, with room for this month so far
  {const past=plan.slice(0,3).map(x=>x.k);const avg={},cur={};CATS.forEach(c=>{avg[c.id]=0;cur[c.id]=0;});
   exps.forEach(e=>{if(e.source==='fixed')return;const mk=e.date.slice(0,7);if(past.includes(mk))avg[e.cat]+=e.amount/past.length;if(mk===CUR)cur[e.cat]+=e.amount;});
   const env={};CATS.forEach(c=>{env[c.id]=Math.ceil(Math.max(avg[c.id],cur[c.id]*1.06)/100)*100;});
   env.food=Math.max(100,Math.ceil(cur.food*0.98/100)*100);
   profile.env=env;profile.target=fixedTot+sum(Object.values(env));}
  const sd=Math.max(1,DAY-3);
  return {profile,expenses:exps,months,bills,demo:true,v:2,moves:[],closed:{},closedInfo:{},skips:[{date:`${CUR}-${pad(sd)}`,note:'Sneakers',amount:4999,key:'shopping'}]};
}
function groupBill(items){const o={};items.forEach(it=>{const c=CAT[it.cat]?it.cat:'other';o[c]=(o[c]||0)+(+it.amount||0);});return Object.entries(o).map(([cat,amount])=>({cat,amount:Math.round(amount)}));}

/* ---------- domain ---------- */
function ensureMonth(){
  if(!S)return;
  if(!S.months)S.months={};
  if(!S.bills)S.bills={};
  if(!S.moves)S.moves=[];if(!S.closed)S.closed={};if(!S.closedInfo)S.closedInfo={};if(!S.skips)S.skips=[];
  migrate();
  if(!S.months[CUR])S.months[CUR]={target:S.profile.target,salary:S.profile.salary};
  const hasFixed=S.expenses.some(e=>e.source==='fixed'&&e.date.startsWith(CUR));
  if(!hasFixed&&S.profile.fixed&&S.profile.fixed.length){
    S.profile.fixed.forEach(f=>{if(+f.amount>0)S.expenses.push({id:newId(),date:CUR+'-01',amount:+f.amount,cat:f.cat||'bills',note:f.name||'Fixed cost',source:'fixed'});});
  }
  closeMonths();allocateMonth(CUR);
}
const monthExp=k=>S.expenses.filter(e=>e.date.startsWith(k)&&e.date<=todayStr);
const fixedTotal=()=>sum((S.profile.fixed||[]).map(f=>+f.amount||0));
const mTarget=k=>(S.months&&S.months[k]&&S.months[k].target)||S.profile.target;
const mSalary=k=>(S.months&&S.months[k]&&S.months[k].salary)||S.profile.salary;
function byCat(list){const o={};CATS.forEach(c=>o[c.id]=0);list.forEach(e=>{o[CAT[e.cat]?e.cat:'other']+=e.amount;});return o;}
function monthKeys(){const set=new Set(S.expenses.map(e=>mkey(e.date)).filter(k=>k<=CUR));set.add(CUR);return [...set].sort().reverse();}
function sortExp(list){return list.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.amount-a.amount));}

function curStats(){
  const k=CUR,n=dim(k),t=DAY;
  const list=monthExp(k);const total=sum(list.map(e=>e.amount));
  const fixedSpent=sum(list.filter(e=>e.source==='fixed').map(e=>e.amount));
  const fx=Math.max(fixedTotal(),fixedSpent);
  const target0=mTarget(k);const salary=mSalary(k);
  const funded=(S.moves&&S.moves.some(m=>m.month===k))?sum(CATS.map(c=>envFunded(c.id,k))):target0-fx;
  const varBudget=Math.max(0,funded);
  const target=(S.moves&&S.moves.some(m=>m.month===k))?fx+varBudget:target0;
  const vl=list.filter(e=>e.source!=='fixed'&&!e.env);
  const varSpent=sum(vl.map(e=>e.amount));
  const varToday=sum(vl.filter(e=>e.date===todayStr).map(e=>e.amount));
  const varBefore=varSpent-varToday;
  const daysLeft=n-t+1;
  const allowance=(varBudget-varBefore)/daysLeft;
  const safeLeft=allowance-varToday;
  const expected=varBudget*t/n;
  const projected=fx+varSpent/t*n;
  const small=vl.filter(e=>e.amount<200);
  return {k,n,t,list,total,fx,target,salary,varBudget,varSpent,varToday,varBefore,daysLeft,allowance,safeLeft,expected,projected,projSave:salary-projected,remainingVar:varBudget-varSpent,small:{count:small.length,total:sum(small.map(e=>e.amount))}};
}
function dailySeries(k){const n=dim(k);const d=Array(n).fill(0);monthExp(k).forEach(e=>{d[+e.date.slice(8,10)-1]+=e.amount;});return d;}
function catUpToDay(k,day){const d=pad(day);return byCat(monthExp(k).filter(e=>e.date.slice(8,10)<=d));}

function monthSummary(k){
  const list=monthExp(k);const total=sum(list.map(e=>e.amount));const bc=byCat(list);
  const ranked=CATS.map(c=>({id:c.id,v:bc[c.id]})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const daily=dailySeries(k);let bi=0;daily.forEach((v,i)=>{if(v>daily[bi])bi=i;});
  // biggest variable day (ignore fixed day-1 rent)
  const vdaily=Array(dim(k)).fill(0);list.filter(e=>e.source!=='fixed').forEach(e=>{vdaily[+e.date.slice(8,10)-1]+=e.amount;});let vi=0;vdaily.forEach((v,i)=>{if(v>vdaily[vi])vi=i;});
  const target=mTarget(k);const salary=mSalary(k);
  return {k,list,total,bc,ranked,daily,vdaily,bigDay:vi+1,bigDayAmt:vdaily[vi],target,salary,saved:salary-total,count:list.length,current:k===CUR};
}

function alerts(st){
  const out=[];
  if(S.moves&&S.moves.length){
    const overE=spendKeys().filter(k=>envBal(k)<-0.5);
    if(overE.length)out.push({lv:'crit',h:overE.length===1?`${CAT[overE[0]].name} envelope is ${inr(-envBal(overE[0]))} over`:`${overE.length} envelopes are over`,t:(overE.length>1?overE.map(k=>`${CAT[k].name} ${inr(-envBal(k))} over`).join(' · ')+'. ':'')+'Cover it from another envelope on the Envelopes tab.'});
    const low=spendKeys().filter(k=>{const b=envBal(k),f=envFunded(k);return b>=0&&f>0&&b<f*0.15&&st.daysLeft>5;});
    if(low.length)out.push({lv:'warn',h:`${CAT[low[0]].name} is running low`,t:`${inr(envBal(low[0]))} left for ${st.daysLeft} days (${inr(envBal(low[0])/st.daysLeft)} a day).`});
  }
  if(st.varBudget<=0){out.push({lv:'crit',h:'Your fixed costs use up the whole limit',t:`Fixed costs are ${inr(st.fx)} against a ${inr(st.target)} limit. Raise the limit in Settings or review fixed costs.`});return out;}
  const diff=st.varSpent-st.expected;
  if(diff>st.varBudget*0.03)out.push({lv:'warn',h:`${inr(diff)} ahead of pace`,t:`By day ${st.t} you'd ideally have spent ${inr(st.expected)} on day-to-day costs. You've spent ${inr(st.varSpent)}.`});
  else if(diff<-st.varBudget*0.03)out.push({lv:'good',h:`${inr(-diff)} under pace`,t:`Nice. You've spent ${inr(st.varSpent)} on day-to-day costs, below the ${inr(st.expected)} pace for day ${st.t}.`});
  else out.push({lv:'good',h:'Right on pace',t:`Day-to-day spending is ${inr(st.varSpent)}, close to the ${inr(st.expected)} pace for day ${st.t}.`});
  if(st.projected>st.target)out.push({lv:'crit',h:`Heading ${inr(st.projected-st.target)} over target`,t:`At this rate you'll spend about ${inr(st.projected)} this month against your ${inr(st.target)} limit.`});
  else out.push({lv:'good',h:`Projected ${inr(st.projected)} this month`,t:`That's ${inr(st.target-st.projected)} under your limit.`});
  if(st.projSave<(S.profile.saveTarget||0))out.push({lv:'warn',h:`Savings target at risk`,t:`Projected savings are ${inr(Math.max(0,st.projSave))}; your target is ${inr(S.profile.saveTarget)}.`});
  const prev=addMonths(CUR,-1);
  if(monthExp(prev).length){
    const a=catUpToDay(CUR,st.t),b=catUpToDay(prev,Math.min(st.t,dim(prev)));
    let best=null;CATS.forEach(c=>{if(!['food','groceries','travel','shopping','fun'].includes(c.id))return;const d=a[c.id]-b[c.id];if(b[c.id]>0&&d>800&&d/b[c.id]>0.3){if(!best||d>best.d)best={c,d,p:d/b[c.id]};}});
    if(best)out.push({lv:'warn',h:`${best.c.name} is up ${Math.round(best.p*100)}%`,t:`${inr(a[best.c.id])} so far vs ${inr(b[best.c.id])} by the same day in ${mLong(prev)}.`});
  }
  if(st.small.count>=10)out.push({lv:'info',h:`${st.small.count} small payments add up to ${inr(st.small.total)}`,t:'Payments under ₹200 are easy to miss. Together they are a real chunk of your month.'});
  return out;
}


/* ---------- envelopes ---------- */
const DEFAULT_ENV={food:6000,groceries:4000,travel:3000,shopping:2000,bills:1500,fun:1500,health:1000,other:500};
const isSpend=key=>!!CAT[key];
function goalsList(){return (S&&S.profile.goals)||[];}
function goalById(id){return goalsList().find(g=>g.id===id);}
function envName(key){if(CAT[key])return CAT[key].name;if(key==='savings')return 'Savings';if(key==='unalloc')return 'Unallocated money';const g=goalById(key);return g?g.name:'Old goal';}
function envColor(key){if(CAT[key])return cc(key);if(key==='savings')return 'var(--good)';if(key==='unalloc')return 'var(--muted)';return 'var(--accent)';}
function movesFor(key,k){return (S.moves||[]).filter(m=>(m.to===key||m.from===key)&&((isSpend(key)||key==='unalloc')?m.month===k:m.month<=k));}
function envFunded(key,k=CUR){return sum(movesFor(key,k).map(m=>m.to===key?m.amount:-m.amount));}
function envSpentAmt(key,k=CUR){
  if(isSpend(key))return sum(monthExp(k).filter(e=>e.source!=='fixed'&&!e.env&&e.cat===key).map(e=>e.amount));
  return sum(S.expenses.filter(e=>e.env===key&&mkey(e.date)<=k&&e.date<=todayStr).map(e=>e.amount));
}
function envBal(key,k=CUR){return envFunded(key,k)-envSpentAmt(key,k);}
function envAlloc(key,k=CUR){return sum((S.moves||[]).filter(m=>m.to===key&&m.month===k&&m.kind==='alloc').map(m=>m.amount));}
function unallocated(k=CUR){return mSalary(k)-fixedTotal()-sum((S.moves||[]).filter(m=>m.month===k&&m.kind==='alloc').map(m=>m.amount))+envFunded('unalloc',k);}
function spendKeys(k=CUR){return CATS.map(c=>c.id).filter(id=>envFunded(id,k)!==0||envSpentAmt(id,k)>0);}
const DLEFT=()=>dim(CUR)-DAY+1;
function addMove(from,to,amount,kind,note){const m={id:newId('m'),month:CUR,date:todayStr,from,to,amount:Math.round(amount),kind,note:note||''};S.moves.push(m);return m;}
function allocateMonth(k){
  if(!S.months[k])S.months[k]={target:S.profile.target,salary:S.profile.salary};
  if(S.months[k].allocated)return;
  const d=k+'-01';
  Object.entries(S.profile.env||{}).forEach(([c,a])=>{if(+a>0)S.moves.push({id:newId('m'),month:k,date:d,from:'income',to:c,amount:+a,kind:'alloc'});});
  goalsList().forEach(g=>{if(+g.monthly>0)S.moves.push({id:newId('m'),month:k,date:d,from:'income',to:g.id,amount:+g.monthly,kind:'alloc'});});
  if(+S.profile.savingsMonthly>0)S.moves.push({id:newId('m'),month:k,date:d,from:'income',to:'savings',amount:+S.profile.savingsMonthly,kind:'alloc'});
  S.months[k].allocated=true;
}
function closeMonths(){
  const ks=new Set(Object.keys(S.months||{}));(S.moves||[]).forEach(m=>ks.add(m.month));
  [...ks].filter(k=>k<CUR).sort().forEach(k=>{
    if(S.closed[k])return;
    let saved=0,carried=0;
    CATS.forEach(c=>{
      const left=Math.round(envBal(c.id,k));if(left<1)return;
      const rule=(S.profile.rollover||{})[c.id]||'save';
      if(rule==='carry'){const nk=addMonths(k,1);S.moves.push({id:newId('m'),month:nk,date:nk+'-01',from:'carry',to:c.id,amount:left,kind:'carry'});carried+=left;}
      else{S.moves.push({id:newId('m'),month:k,date:k+'-'+pad(dim(k)),from:c.id,to:'savings',amount:left,kind:'sweep'});saved+=left;}
    });
    S.closed[k]=true;S.closedInfo[k]={saved,carried};
  });
}
function migrate(){
  const p=S.profile;if(p.env)return;
  const varB=Math.max(0,(p.target||0)-fixedTotal());
  const bc=byCat(monthExp(addMonths(CUR,-1)).filter(e=>e.source!=='fixed'));const tot=sum(Object.values(bc));
  const env={};CATS.forEach(c=>{env[c.id]=tot>0?Math.round(varB*bc[c.id]/tot/100)*100:Math.round(varB*(DEFAULT_ENV[c.id]/sum(Object.values(DEFAULT_ENV)))/100)*100;});
  p.env=env;p.goals=[];p.savingsMonthly=p.saveTarget||0;p.rollover={};
  // mark earlier months as already closed so nothing is swept retroactively
  Object.keys(S.months||{}).forEach(k=>{if(k<CUR){S.closed[k]=true;S.months[k].allocated=true;}});
}
function goalDelayWeeks(g,amt){return g&&g.monthly>0?Math.max(1,Math.round(amt/g.monthly*4.33)):null;}
function coverSources(target){
  const out=[];
  const un=unallocated();if(un>=1&&target!=='unalloc')out.push({key:'unalloc',avail:un});
  CATS.forEach(c=>{if(c.id!==target){const b=envBal(c.id);if(b>=1)out.push({key:c.id,avail:b});}});
  goalsList().forEach(g=>{if(g.id!==target){const b=envBal(g.id);if(b>=1)out.push({key:g.id,avail:b,goal:g});}});
  const sb=envBal('savings');if(sb>=1&&target!=='savings')out.push({key:'savings',avail:sb,locked:true});
  return out;
}
function coverPlan(target,need,picks,unlock){
  let rem=need;const plan=[];const src=coverSources(target);
  picks.forEach(k=>{const s=src.find(x=>x.key===k);if(!s||(s.locked&&!unlock))return;const t=Math.min(s.avail,rem);if(t>=1){plan.push({key:k,amount:Math.round(t)});rem-=t;}});
  return {plan,remaining:Math.max(0,Math.round(rem))};
}
function coverHTML(target,need,picks,unlock){
  const src=coverSources(target);const dl=DLEFT();
  if(!src.length)return '<p class="hint">No other envelope has money left this month.</p>';
  const {remaining}=coverPlan(target,need,picks,unlock);
  return `<div class="stack" style="gap:8px">${src.map(sx=>{
    const on=picks.includes(sx.key);const take=Math.min(sx.avail,need);let sub=`${inr(sx.avail)} available`;
    if(sx.key==='unalloc')sub+=' · money without a job yet';
    else if(sx.goal){const w=goalDelayWeeks(sx.goal,take);if(w)sub+=` · delays ${esc(sx.goal.name)} by about ${w} ${w===1?'week':'weeks'}`;}
    else if(sx.key==='savings')sub+=unlock?' · unlocked for this':' · locked';
    else sub+=` · leaves ${inr(sx.avail-take)} (${inr((sx.avail-take)/dl)}/day)`;
    const dis=sx.locked&&!unlock;
    return `<button class="opt" data-act="pickSrc" data-key="${esc(sx.key)}" aria-pressed="${on}" ${dis?'disabled':''}><i class="dot" style="background:${envColor(sx.key)}"></i><span><span class="t">${esc(envName(sx.key))}</span>${sx.key==='unalloc'?' <span class="pill good">Best option</span>':''}<br><span class="s num">${sub}</span></span><span aria-hidden="true">${on?'✓':''}</span></button>`;}).join('')}
    ${src.some(x=>x.locked)&&!unlock?'<button class="btn small ghost" data-act="unlockSav" style="align-self:flex-start">Unlock Savings for this</button>':''}
    ${remaining>0?`<p class="hint num">Pick envelopes to cover ${inr(remaining)} more.</p>`:'<span class="pill good" style="align-self:flex-start">✓ Fully covered</span>'}
  </div>`;
}
function applyCover(target,plan,note){plan.forEach(pl=>addMove(pl.key,target,pl.amount,'cover',note));}
function finalizeDemo(){
  Object.keys(S.months).sort().forEach(k=>allocateMonth(k));
  const first=Object.keys(S.months).sort()[0];

  groceries:['grocery','groceries','dmart','bigbasket','blinkit','zepto','milk','vegetables','veggies','sabzi','fruits','kirana','atta','rice','dal','eggs','bread'],
  travel:['auto','uber','ola','rapido','metro','bus','cab','petrol','fuel','diesel','train','flight','parking','toll','taxi','fastag'],
  shopping:['shirt','shoes','amazon','flipkart','myntra','clothes','shopping','jeans','kurta','dress','watch','bag','headphones','ajio','meesho'],
  bills:['rent','electricity','wifi','wi-fi','internet','recharge','bill','emi','gas','water','dth','broadband'],

};
function guessCat(t){const s=' '+t.toLowerCase()+' ';for(const [c,ws] of Object.entries(KW)){for(const w of ws){if(s.includes(w))return c;}}return 'other';}
function parseQuick(text){
  const parts=String(text).split(/[,\n;]+| and /i).map(x=>x.trim()).filter(Boolean);
  const out=[];
  for(const p of parts){
    const m=p.replace(/,/g,'').match(/(?:₹|rs\.?|inr)?\s*(\d+(?:\.\d+)?)\s*(k)?/i);
    if(!m)continue;
    let amt=parseFloat(m[1]);if(m[2])amt*=1000;
    const note=p.replace(m[0],'').replace(/\b(spent|paid|for|on|rs|rupees)\b/gi,'').replace(/\s+/g,' ').trim()||'Expense';
    out.push({note:note.charAt(0).toUpperCase()+note.slice(1),amount:Math.round(amt),cat:guessCat(note)});
  }
  return out;
}

function md(t){
  let h=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  let out='',inL=false;
  for(const ln of h.split('\n')){
    const m=ln.match(/^\s*(?:[-•*]|\d+\.)\s+(.*)/);
    if(m){if(!inL){out+='<ul>';inL=true;}out+='<li>'+m[1]+'</li>';}
    else{if(inL){out+='</ul>';inL=false;}if(ln.trim())out+='<p>'+ln.replace(/^#+\s*/,'')+'</p>';}

}

function readProfileForm(){
  const g=id=>{const el=document.getElementById(id);return el?el.value:'';};
  const d=ui.draft||{};
  const fx=[];const n=(d.fixed?d.fixed.length:0);
  for(let i=0;i<n;i++){fx.push({name:g('fx-name-'+i).trim(),amount:+g('fx-amt-'+i)||0,cat:g('fx-cat-'+i)||'bills'});}
  const env={};CATS.forEach(c=>{env[c.id]=+g('env-'+c.id)||0;});
  const goals=(d.goals||[]).map((dg,i)=>({id:dg.id||newId('g'),name:g('goal-name-'+i).trim(),target:+g('goal-tgt-'+i)||0,monthly:+g('goal-mon-'+i)||0,saved:dg.isNew?(+g('goal-saved-'+i)||0):0,isNew:!!dg.isNew}));
  const savingsMonthly=+g('pf-savm')||0;
  const fxSum=sum(fx.map(f=>f.amount));
  return {name:g('pf-name').trim(),salary:+g('pf-salary')||0,fixed:fx,env,goals,savingsMonthly,rollover:d.rollover||{},
    target:fxSum+sum(Object.values(env)),saveTarget:sum(goals.map(x=>x.monthly))+savingsMonthly};
}
function validateProfile(p){
  if(!(p.salary>0))return 'Enter your monthly salary.';
  const envS=sum(Object.values(p.env));
  if(!(envS>0))return 'Give at least one spending envelope a monthly amount.';
  if(p.goals.some(x=>!(x.target>0)))return 'Give each goal a target amount.';
  const total=sum(p.fixed.map(f=>f.amount))+envS+sum(p.goals.map(x=>x.monthly))+p.savingsMonthly;
  if(total>p.salary)return `Your plan adds up to ${inr(total)}, which is ${inr(total-p.salary)} more than your salary. Lower some envelopes or goals.`;
  return '';
}

function localAnswer(q){
  const s=q.toLowerCase();const st=curStats();const prev=addMonths(CUR,-1);
  const bc=byCat(st.list);
  const rank=CATS.map(c=>({c,v:bc[c.id]})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  // category + month question
  const catHit=CATS.find(c=>c.id!=='other'&&s.includes(c.name.toLowerCase().split(' ')[0].replace('&','')))||(/food|eat|swiggy|zomato/.test(s)?CAT.food:null);
  const monHit=MONTHS.findIndex(m=>s.includes(m.toLowerCase()));
  if(catHit&&monHit>=0&&!/why/.test(s)){
    const k=monthKeys().find(k=>pmk(k).m===monHit+1);
    if(!k)return `I don't have any expenses for ${MONTHS[monHit]}.`;
    const ms=monthSummary(k);return `You spent **${inr(ms.bc[catHit.id])}** on ${catHit.name.toLowerCase()} in ${monthName(k)}, ${ms.total>0?Math.round(ms.bc[catHit.id]/ms.total*100):0}% of that month's ${inr(ms.total)}.`;
  }
  if(/afford|can i buy|should i buy/.test(s)){
    const m=q.replace(/,/g,'').match(/(\d+(?:\.\d+)?)\s*(k)?/i);
    if(!m)return 'Tell me the price, like “Can I afford ₹3,000 shoes?”, or tap **Can I afford this?** on the Envelopes tab.';
    const price=Math.round(+m[1]*(m[2]?1000:1));let cat=guessCat(q.replace(m[0],''));if(cat==='other')cat='shopping';
    const bal=envBal(cat);
    if(bal>=price)return `Yes. Your ${CAT[cat].name} envelope has ${inr(bal)}, so you'd have **${inr(bal-price)}** left after this (${inr((bal-price)/DLEFT())} a day for ${DLEFT()} days).`;
    const need=price-Math.max(0,bal);const un=unallocated();const g=goalsList().find(x=>envBal(x.id)>=need);const w=g?goalDelayWeeks(g,need):null;
    return `Not from ${CAT[cat].name} alone. It has ${inr(Math.max(0,bal))}, so you're **${inr(need)} short**.${un>=need?` You could cover it from your ${inr(un)} of unallocated money.`:''}${g&&w?` Taking it from ${g.name} would delay that goal by about ${w} ${w===1?'week':'weeks'}.`:''} Use **Can I afford this?** on the Envelopes tab to cover it or skip it.`;
  }
  if(/envelope|left in|how much.*left/.test(s)){
    const ks=spendKeys();if(!ks.length)return 'You have no envelopes yet. Add monthly amounts in Settings.';
    return `Here's what's left this month (${DLEFT()} days to go):\n`+ks.map(k=>{const b=envBal(k);return `- ${CAT[k].name}: ${b<-0.5?`**${inr(-b)} over**`:`${inr(b)} (${inr(b/DLEFT())} a day)`}`;}).join('\n');
  }
  if(/today|per day|daily|can i spend|safe/.test(s)){
    if(st.safeLeft<0)return `You're **${inr(-st.safeLeft)} over** today's allowance of ${inr(Math.max(0,st.allowance))}. You still have ${inr(Math.max(0,st.remainingVar))} for day-to-day costs over the next ${st.daysLeft} days.`;
    return `You can spend about **${inr(st.safeLeft)}** more today. You have ${inr(st.remainingVar)} left for day-to-day costs across ${st.daysLeft} days, and you've spent ${inr(st.varToday)} today.`;
  }
  if(/why/.test(s)&&catHit){
    const list=st.list.filter(e=>e.cat===catHit.id);const m={};list.forEach(e=>{m[e.note]=(m[e.note]||0)+e.amount;});
    const top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const pb=monthExp(prev).length?catUpToDay(prev,Math.min(st.t,dim(prev)))[catHit.id]:null;
    return `${catHit.name} is at **${inr(bc[catHit.id])}** this month across ${list.length} expenses.${pb!=null?` By the same day in ${mLong(prev)} it was ${inr(pb)}.`:''}\n${top.map(([n,v])=>`- ${n}: ${inr(v)}`).join('\n')}`;
  }
  if(/cut|reduce|less|tips|advice/.test(s)){
    const disc=rank.filter(x=>['food','shopping','fun','travel'].includes(x.c.id)).slice(0,2);
    if(!disc.length)return 'Nothing stands out yet. Your spending is mostly fixed costs.';
    return `The easiest places to cut:\n${disc.map(x=>`- ${x.c.name}: ${inr(x.v)} so far. Cutting 20% saves about **${inr(x.v*0.2/st.t*st.n)}** over the month.`).join('\n')}${st.small.count>=10?`\n- ${st.small.count} payments under ₹200 add up to ${inr(st.small.total)}.`:''}`;
  }
  if(/where|most|biggest|go\b|went/.test(s)){
    if(!rank.length)return 'No expenses logged this month yet.';
    return `This month you've spent ${inr(st.total)}. The biggest categories:\n${rank.slice(0,3).map(x=>`- ${x.c.name}: **${inr(x.v)}** (${Math.round(x.v/st.total*100)}%)`).join('\n')}${bc.bills?`\nBills & rent are mostly fixed costs you planned for.`:''}`;
  }
  if(/save|saving/.test(s)){
    const tgt=S.profile.saveTarget||0;
    if(st.projSave>=tgt)return `Yes. At your current pace you'll save about **${inr(st.projSave)}** this month, above your ${inr(tgt)} target.`;
    const room=(st.salary-tgt)-st.total;
    return `Not yet. At your current pace you'll save about **${inr(Math.max(0,st.projSave))}**, ${inr(tgt-Math.max(0,st.projSave))} short of your ${inr(tgt)} target.${room>0?` To reach it, keep the rest of this month's spending to ${inr(room)}, about ${inr(room/st.daysLeft)} a day.`:` Spending has already passed the level that allows it this month.`}`;
  }
  if(/compare|last month|previous/.test(s)){
    if(!monthExp(prev).length)return `I don't have data for ${mLong(prev)} yet.`;
    const a=catUpToDay(CUR,st.t),b=catUpToDay(prev,Math.min(st.t,dim(prev)));
    const ta=sum(Object.values(a)),tb=sum(Object.values(b));
    const ch=CATS.map(c=>({c,d:a[c.id]-b[c.id]})).filter(x=>Math.abs(x.d)>=300).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).slice(0,3);
    return `By day ${st.t} you've spent **${inr(ta)}**, vs ${inr(tb)} by the same day in ${mLong(prev)} (${ta>=tb?'up':'down'} ${inr(Math.abs(ta-tb))}).${ch.length?'\n'+ch.map(x=>`- ${x.c.name}: ${x.d>0?'up':'down'} ${inr(Math.abs(x.d))}`).join('\n'):''}`;
  }
  return null;
}
async function sendChat(text){
  text=String(text||'').trim();if(!text||ui.chat.busy)return;
  ui.chat.msgs.push({id:newId('m'),role:'user',text});
  const local=localAnswer(text);
  if(!aiOn()){
    const quick=parseQuick(text);
    let reply=local;
    if(!reply&&quick.length&&/\d/.test(text)&&text.length<80&&!/\?|^(how|what|why|when|where|which|can|could|should|is|am|are|do|does|will|would)\b/i.test(text)){quick.forEach(q=>addExpense({...q,source:'chat'}));reply=`Added ${quick.map(q=>`${q.note} ${inr(q.amount)} (${CAT[q.cat].name})`).join(', ')}. Safe to spend today is now **${inr(curStats().safeLeft)}**.`;}
    ui.chat.msgs.push({id:newId('m'),role:'bot',text:reply||'I can answer questions about today, categories, savings, last month and where to cut back. Try one of the suggestions below.',note:aiChecked?'Answered offline from your data':''});
    updateChatDOM();return;
  }
  const m={id:newId('m'),role:'bot',text:'',pending:true};ui.chat.msgs.push(m);ui.chat.busy=true;updateChatDOM();
  const withTools=!!(LIMITS&&LIMITS.tools);
  const hist=ui.chat.msgs.filter(x=>!x.pending&&x.text&&!x.failed).slice(-9,-1).map(x=>({role:x.role==='user'?'user':'assistant',content:x.text}));
  const turns=[{role:'user',content:chatRules(withTools)},...hist,{role:'user',content:text}];
  const ctl=new AbortController();ui.chat.ctl=ctl;
  const opts={signal:ctl.signal,cache:false,modelTier:'quick',onText:({text:t})=>{m.text=t;m.pending=false;const el=document.querySelector(`[data-mid="${m.id}"]`);if(el){el.innerHTML=md(t);scrollChat();}}};
  if(withTools)opts.tools=[{
    name:'add_expense',
    description:'Log one expense the user says they made. Returns a confirmation that includes the updated safe-to-spend-today figure.',
    inputSchema:{type:'object',properties:{amount:{type:'number',description:'Amount in rupees, greater than 0'},category:{type:'string',enum:CATS.map(c=>c.id),description:'Category id'},note:{type:'string',description:'Short description, e.g. "Dinner"'},date:{type:'string',description:'YYYY-MM-DD; omit for today'}},required:['amount','category','note']},
    execute(input){
      const amt=Math.round(Number(input.amount));if(!(amt>0)||amt>10000000)throw new Error('amount must be a positive number of rupees');
      const cat=CAT[String(input.category)]?String(input.category):'other';
      const d=typeof input.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(input.date)&&input.date<=todayStr&&input.date>=addMonths(CUR,-6)+'-01'?input.date:todayStr;
      const note=String(input.note||'Expense').slice(0,60);
      addExpense({amount:amt,cat,note,date:d,source:'chat'});
      return `Added ${inr(amt)} for "${note}" to ${CAT[cat].name} on ${d}. The ${CAT[cat].name} envelope now has ${inr(envBal(cat))} left${envBal(cat)<0?' (over budget)':''}. Safe to spend today is now ${inr(curStats().safeLeft)}.`;
    }}];
  try{const res=await SAMPLE(turns,opts);m.text=res.text;if(res.truncated)m.note='Answer was cut short.';}
  catch(e){
    const code=e&&e.code;
    if(BLOCK.includes(code))aiBlocked=true;
    if(code==='cancelled'){m.text=(e.text||'')||'Stopped.';}
    else{
      const keep=e&&e.text?e.text:'';
      if(local){m.text=(keep?keep+'\n\n':'')+local;m.note=errCopy(code)+' Answered offline from your data.';}
      else{m.text=keep||errCopy(code);m.failed=!keep;}
    }
  }
  m.pending=false;ui.chat.busy=false;ui.chat.ctl=null;updateChatDOM();
}
function bindChatForm(){
  const f=document.getElementById('chatform');if(!f)return;
  f.addEventListener('submit',ev=>{ev.preventDefault();const inp=document.getElementById('chatin');const v=inp.value;inp.value='';sendChat(v);});
}

/* ---------- expenses ---------- */
function addExpense(e){
  const x={id:newId(),date:e.date||todayStr,amount:Math.round(+e.amount),cat:CAT[e.cat]?e.cat:'other',note:(e.note||'Expense').trim()||'Expense',source:e.source||'typed'};
  if(e.billId)x.billId=e.billId;
  if(e.env)x.env=e.env;
  S.expenses.push(x);const mk=mkey(x.date);if(!S.months[mk])S.months[mk]={target:S.profile.target,salary:S.profile.salary};
  save();return x;
}

function afterLog(xs){
  const keys=[...new Set(xs.filter(x=>mkey(x.date)===CUR&&!x.env&&x.source!=='fixed').map(x=>x.cat))].filter(k=>envBal(k)<-0.5);
  ui.sheets=keys.length?[{type:'cover',key:keys[0],picks:[],unlock:false}]:[];
  render();
}

function envMonthCard(k){
  const keys=CATS.map(c=>c.id).filter(id=>(S.moves||[]).some(m=>m.month===k&&(m.to===id||m.from===id))||envSpentAmt(id,k)>0);
  if(!keys.length||!(S.moves||[]).length)return '';
  const ci=S.closedInfo&&S.closedInfo[k];
  const rows=keys.map(key=>{
    const mv=movesFor(key,k);const sweep=sum(mv.filter(m=>m.kind==='sweep'&&m.from===key).map(m=>m.amount));
    const budget=sum(mv.filter(m=>m.to===key).map(m=>m.amount))-sum(mv.filter(m=>m.from===key&&m.kind!=='sweep').map(m=>m.amount));
    const spent=envSpentAmt(key,k);const left=budget-spent;
    const carryNext=sum((S.moves||[]).filter(m=>m.kind==='carry'&&m.to===key&&m.month===addMonths(k,1)).map(m=>m.amount));
    let res,cls='';
    if(k===CUR){res=left>=0?`${inr(left)} left`:`${inr(-left)} over`;cls=left<0?'up':'';}
    else if(sweep){res=`${inr(sweep)} → Savings`;cls='down';}
    else if(carryNext){res=`${inr(carryNext)} carried`;cls='down';}
    else if(left<-0.5){res=`${inr(-left)} over`;cls='up';}
    else res='Used up';
    return `<div class="cmprow"><span class="row"><i class="dot" style="background:${cc(key)}"></i>${CAT[key].name}</span><span class="num muted">${inr(spent)} of ${inr(budget)}</span><span class="delta ${cls}">${res}</span></div>`;
  }).join('');
  return `<section class="card"><div class="card-head"><h3>Envelopes</h3><span class="hint">${k===CUR?'so far':ci?`${inr(ci.saved)} saved · ${inr(ci.carried)} carried`:''}</span></div>${rows}</section>`;
}

/* ---------- bill reading ---------- */
function makeThumb(file){return new Promise(res=>{try{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const sc=Math.min(1,360/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);try{res(c.toDataURL('image/jpeg',0.6));}catch(e){res(null);}};img.onerror=()=>{URL.revokeObjectURL(url);res(null);};img.src=url;}catch(e){res(null);}});}
async function onBillFile(ev){
  const file=ev.target.files&&ev.target.files[0];if(!file)return;
  const a=ui.add;a.err='';
  if(!imgOn()){a.err='Reading photos needs AI access, which isn’t available in this view.';render();return;}
  if(LIMITS.images.maxInputBytes&&file.size>LIMITS.images.maxInputBytes){a.err='That photo is too large. Try a smaller image.';render();return;}
  a.busy=true;const ctl=new AbortController();a.ctl=ctl;render();
  const thumbP=makeThumb(file);
  const prompt=`The image is a shop bill or receipt from India. Extract every purchased line item.
Reply with only a JSON object, no other text:
{"merchant": string, "date": "YYYY-MM-DD" or null, "items": [{"name": string, "amount": number, "category": string}], "total": number}
Rules:
- "amount" is the line total in rupees (quantity × price) as a plain number.
- "category" must be one of: food (ready-to-eat snacks, drinks, restaurant items), groceries (staples, produce, dairy, packaged cooking items), travel, shopping (clothes, electronics, accessories), bills, fun, health (medicines, clinic), other (household, cleaning, personal care).
- Skip tax lines, discounts, subtotals and payment lines; if the bill shows a discount, spread it so item amounts still add up to the final total.
- If the image is not a bill, reply {"error":"not_a_bill"}.`;
  try{
    const data=await SAMPLE.json(prompt,{images:[file],signal:ctl.signal});
    if(!data||data.error||!Array.isArray(data.items)||!data.items.length){a.busy=false;a.err=data&&data.error==='not_a_bill'?'That doesn’t look like a bill. Try a photo of a printed receipt.':'No items could be read from that photo. Try a clearer, straight-on photo.';render();return;}
    const items=data.items.map(it=>({name:String(it.name||'Item').slice(0,60),amount:Math.round(Math.abs(Number(it.amount)||0)),cat:CAT[String(it.category)]?String(it.category):guessCat(String(it.name||''))})).filter(it=>it.amount>0);
    if(!items.length){a.busy=false;a.err='No amounts could be read from that photo.';render();return;}
    const d=typeof data.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(data.date)&&data.date<=todayStr?data.date:todayStr;
    Object.assign(a,{busy:false,items,merchant:String(data.merchant||'Bill').slice(0,50),date:d,thumb:await thumbP,sample:false});
  }catch(e){
    a.busy=false;const code=e&&e.code;
    if(BLOCK.includes(code)||code==='images_unavailable'){if(BLOCK.includes(code))aiBlocked=true;else if(LIMITS)LIMITS.images=null;}
    a.err=code==='cancelled'?'':errCopy(code);
  }
  a.ctl=null;render();
}

async function monthTips(k){
  if(!aiOn())return;
  const s=monthSummary(k);const prev=addMonths(k,-1);

  ui.monthAI[k]={busy:true,text:''};render();

    const r=await SAMPLE(`You are Budgetly, an expense-tracking assistant for users in India. Using ONLY the DATA, give exactly 3 short, specific tips for next month as bullet lines starting with "- ". Each tip names a category and a rupee amount taken from DATA (or a simple difference of DATA amounts). Fixed monthly costs are planned; don't suggest cutting rent. Bold one key number per tip with **. No intro or closing line.
DATA: ${JSON.stringify(payload)}`,{modelTier:'quick',onText:({text})=>{st.text=text;st.busy=false;const el=document.getElementById('aitips');if(el)el.innerHTML=md(text);}});

/* ---------- charts (SVG) ---------- */
const tipEl=document.getElementById('tip');
function showTip(html,x,y){tipEl.innerHTML=html;tipEl.hidden=false;const r=tipEl.getBoundingClientRect();let l=x+14,t=y-r.height-12;if(l+r.width>innerWidth-8)l=x-r.width-14;if(l<8)l=8;if(t<8)t=y+18;tipEl.style.left=l+'px';tipEl.style.top=t+'px';}
function hideTip(){tipEl.hidden=true;}
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw)return m*p;}return 10*p;}
function roundTop(x,y,w,h,r){r=Math.min(r,w/2,h);if(h<=0)return '';return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;}

function paceChart(el,st){
  if(!el)return;
  const w=Math.max(260,el.clientWidth),h=220,L=44,R=22,T=16,B=26;
  const n=st.n,t=st.t;
  const daily=dailySeries(CUR);let c=0;const cum=daily.map(v=>c+=v).slice(0,t);
  const ideal=d=>st.fx+st.varBudget*d/n;
  const ymaxRaw=Math.max(st.target,st.projected,cum[cum.length-1]||0)*1.06;
  const step=niceStep(ymaxRaw/4);const ymax=Math.ceil(ymaxRaw/step)*step;
  const x=d=>L+(d-1)/(n-1)*(w-L-R);const y=v=>T+(1-v/ymax)*(h-T-B);
  let g='';
  for(let v=0;v<=ymax+1;v+=step){g+=`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--grid)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v===0?'0':inrK(v)}</text>`;}
  const xt=[1,8,15,22,n];xt.forEach(d=>{g+=`<text x="${x(d)}" y="${h-7}" text-anchor="${d===n?'end':'middle'}">${d} ${mShort(CUR)}</text>`;});
  // target rule
  g+=`<line x1="${L}" x2="${w-R}" y1="${y(st.target)}" y2="${y(st.target)}" style="stroke:var(--crit)" stroke-width="1.5" stroke-dasharray="2 3"/><text x="${L+4}" y="${y(st.target)-5}" text-anchor="start" style="fill:var(--crit);font-weight:600">Limit ${inrK(st.target)}</text>`;
  // ideal
  g+=`<path d="M${x(1)},${y(ideal(1))}L${x(n)},${y(ideal(n))}" fill="none" style="stroke:var(--axis)" stroke-width="2"/>`;
  // area + actual
  const pts=cum.map((v,i)=>`${x(i+1)},${y(v)}`);
  if(pts.length){
    g+=`<path d="M${x(1)},${y(0)}L${pts.join('L')}L${x(t)},${y(0)}Z" style="fill:var(--accent);opacity:.1"/>`;
    g+=`<path d="M${pts.join('L')}" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(t<n)g+=`<path d="M${x(t)},${y(cum[t-1])}L${x(n)},${y(st.projected)}" fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-dasharray="5 4"/><circle cx="${x(n)}" cy="${y(st.projected)}" r="4" style="fill:var(--surface);stroke:var(--accent)" stroke-width="2"/>`;
    g+=`<circle cx="${x(t)}" cy="${y(cum[t-1])}" r="5" style="fill:var(--accent);stroke:var(--surface)" stroke-width="2"/>`;
  }
  g+=`<line id="pace-x" x1="0" x2="0" y1="${T}" y2="${h-B}" style="stroke:var(--ink-2)" stroke-width="1" opacity="0"/><circle id="pace-dot" r="4" cx="0" cy="0" style="fill:var(--accent);stroke:var(--surface)" stroke-width="2" opacity="0"/>`;
  el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Cumulative spending ${inr(cum[t-1]||0)} by day ${t}; ideal pace ${inr(ideal(t))}; projected ${inr(st.projected)} against a ${inr(st.target)} limit">${g}</svg>`;
  const svg=el.querySelector('svg');const vx=el.querySelector('#pace-x'),vd=el.querySelector('#pace-dot');
  const move=ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)*(w/r.width);let d=Math.round((px-L)/(w-L-R)*(n-1))+1;d=Math.max(1,Math.min(n,d));
    vx.setAttribute('x1',x(d));vx.setAttribute('x2',x(d));vx.setAttribute('opacity','.5');
    const has=d<=t;if(has){vd.setAttribute('cx',x(d));vd.setAttribute('cy',y(cum[d-1]));vd.setAttribute('opacity','1');}else vd.setAttribute('opacity','0');
    showTip(`<b>${d} ${mShort(CUR)}</b><br>${has?`Spent so far ${inr(cum[d-1])}<br>That day ${inr(daily[d-1])}<br>`:`Projected ${inr(st.fx+st.varSpent/t*d)}<br>`}Ideal ${inr(ideal(d))}`,ev.clientX,ev.clientY);};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',()=>{vx.setAttribute('opacity','0');vd.setAttribute('opacity','0');hideTip();});
}

function barsChart(el,{labels,values,colors,tips,target,h,valueLabels,aria}){
  if(!el)return;
  const w=Math.max(240,el.clientWidth),H=h||190,L=40,R=10,T=18,B=24;
  const nB=values.length;
  const ymaxRaw=Math.max(target||0,...values,1)*1.1;const step=niceStep(ymaxRaw/4);const ymax=Math.ceil(ymaxRaw/step)*step;
  const y=v=>T+(1-v/ymax)*(H-T-B);
  const slot=(w-L-R)/nB;const bw=Math.max(3,Math.min(56,slot-2));
  let g='';
  for(let v=0;v<=ymax+1;v+=step)g+=`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--grid)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v===0?'0':inrK(v)}</text>`;
  values.forEach((v,i)=>{const bx=L+i*slot+(slot-bw)/2;const by=y(v);g+=`<path d="${roundTop(bx,by,bw,y(0)-by,4)}" style="fill:${colors[i]}"/>`;
    if(valueLabels&&valueLabels[i])g+=`<text x="${bx+bw/2}" y="${by-5}" text-anchor="middle" style="fill:var(--ink-2);font-weight:600">${valueLabels[i]}</text>`;
    if(labels[i])g+=`<text x="${bx+bw/2}" y="${H-7}" text-anchor="middle">${esc(labels[i])}</text>`;});
  g+=`<line x1="${L}" x2="${w-R}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--axis)"/>`;
  if(target)g+=`<line x1="${L}" x2="${w-R}" y1="${y(target)}" y2="${y(target)}" style="stroke:var(--ink-2)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${w-R}" y="${y(target)-5}" text-anchor="end" style="fill:var(--ink-2);font-weight:600">Limit ${inrK(target)}</text>`;
  g+=`<rect id="hl" x="0" y="${T}" width="${slot}" height="${H-T-B}" style="fill:var(--ink)" opacity="0"/>`;
  el.innerHTML=`<svg viewBox="0 0 ${w} ${H}" width="${w}" height="${H}" role="img" aria-label="${esc(aria)}">${g}</svg>`;
  const svg=el.querySelector('svg');const hl=svg.querySelector('#hl');
  const move=ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)*(w/r.width);const i=Math.floor((px-L)/slot);if(i<0||i>=nB){hl.setAttribute('opacity','0');hideTip();return;}hl.setAttribute('x',L+i*slot);hl.setAttribute('opacity','.06');showTip(tips[i],ev.clientX,ev.clientY);};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);svg.addEventListener('pointerleave',()=>{hl.setAttribute('opacity','0');hideTip();});
}
function monthsChart(el,keys){
  const vals=keys.map(k=>sum(monthExp(k).map(e=>e.amount)));
  const tg=keys.map(mTarget);
  barsChart(el,{labels:keys.map(k=>mShort(k)+(k===CUR?'*':'')),values:vals,colors:keys.map((k,i)=>k===CUR?'var(--accent-2)':vals[i]>tg[i]?'var(--crit)':'var(--accent)'),
    tips:keys.map((k,i)=>`<b>${monthName(k)}${k===CUR?' (so far)':''}</b><br>Spent ${inr(vals[i])}<br>Limit ${inr(tg[i])}<br>${k===CUR?'In progress':vals[i]>tg[i]?`Over by ${inr(vals[i]-tg[i])}`:`Under by ${inr(tg[i]-vals[i])}`}`),
    target:tg[tg.length-1],h:210,valueLabels:vals.map(inrK),aria:'Monthly spending: '+keys.map((k,i)=>`${monthName(k)} ${inr(vals[i])}`).join(', ')});
}
function dailyChart(el,k,daily,upto){
  const n=daily.length;const vals=daily.map((v,i)=>i<upto?v:0);
  let mx=0;vals.forEach((v,i)=>{if(v>vals[mx])mx=i;});
  barsChart(el,{labels:vals.map((v,i)=>(i+1)%7===1?String(i+1):''),values:vals,
    colors:vals.map(()=>'var(--accent)'),
    tips:vals.map((v,i)=>`<b>${i+1} ${mShort(k)}</b><br>${i<upto?`Spent ${inr(v)}`:'Not yet'}`),
    valueLabels:vals.map((v,i)=>i===mx&&v>0?inrK(v):''),h:190,aria:`Day-to-day spending per day in ${monthName(k)}; highest on day ${mx+1} at ${inr(vals[mx])}`});
}
function donutChart(el,s){
  if(!el)return;
  if(!s.total){el.innerHTML='<p class="muted">No expenses.</p>';return;}
  const top=s.ranked.slice(0,5);const rest=s.ranked.slice(5);const segs=top.map(x=>({id:x.id,name:CAT[x.id].name,v:x.v,col:cc(x.id)}));
  if(rest.length)segs.push({id:'other',name:'Everything else',v:sum(rest.map(x=>x.v)),col:'var(--c-other)'});
  const size=164,r=62,sw=24,C=2*Math.PI*r;let off=0;let g='';
  segs.forEach(sg=>{const len=sg.v/s.total*C;const gap=segs.length>1?2:0;g+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:${sg.col}" stroke-width="${sw}" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"><title>${esc(sg.name)}: ${inr(sg.v)}</title></circle>`;off+=len;});
  g+=`<text x="${size/2}" y="${size/2-2}" text-anchor="middle" style="fill:var(--ink);font-family:var(--display);font-size:20px;font-weight:700">${inrK(s.total)}</text><text x="${size/2}" y="${size/2+16}" text-anchor="middle">total</text>`;
  el.innerHTML=`<div class="donutwrap"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Share of spending: ${segs.map(x=>`${x.name} ${Math.round(x.v/s.total*100)}%`).join(', ')}">${g}</svg>
  <div class="dleg">${segs.map(x=>`<div><span><i class="dot" style="background:${x.col}"></i>${esc(x.name)}</span><b class="num">${Math.round(x.v/s.total*100)}%</b></div>`).join('')}</div></div>`;
}

let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(ui.view!=='app')return;const top=ui.sheets[ui.sheets.length-1];if(top&&top.type==='add')return;const active=document.activeElement&&document.activeElement.id==='chatin';if(active)return;render();},200);});

/* ---------- boot ---------- */
load();
if(S&&S.demo&&S.v!==2){S=seedDemo();finalizeDemo();}
if(S){ensureMonth();save();ui.view='app';}
render();
(async()=>{
  try{if(window.claude&&typeof window.claude.use==='function'){SAMPLE=await window.claude.use('sample');if(SAMPLE){LIMITS=await SAMPLE.limits().catch(()=>null);}}}catch(e){SAMPLE=null;}
  aiChecked=true;
  const top=ui.sheets[ui.sheets.length-1];
  if(ui.view==='app'&&(!top||top.type==='month'))render();
  else if(top&&top.type==='add'&&ui.add.mode==='bill'&&!ui.add.items&&!ui.add.busy)render();
})();
})();
